<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brady James Photography</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    background:#0f0f10;
    color:#f2f2f2;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Background gradient */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at top left,#2c2c2c 0%,transparent 45%),
        radial-gradient(circle at bottom right,#1a1a1a 0%,transparent 40%);
    opacity:.7;
}

/* Film grain */
body::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:4px 4px;
    opacity:.25;
    pointer-events:none;
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    padding:50px;
    max-width:700px;
}

h1{
    font-size:clamp(2.6rem,6vw,4.8rem);
    font-weight:300;
    letter-spacing:.28em;
    text-transform:uppercase;
    margin-bottom:18px;
}

.divider{
    width:120px;
    height:2px;
    background:#c8a96a;
    margin:0 auto 35px;
}

.tagline{
    font-size:1.15rem;
    color:#cccccc;
    letter-spacing:.08em;
    margin-bottom:40px;
    line-height:1.7;
}

.coming{
    display:inline-block;
    border:1px solid rgba(255,255,255,.25);
    padding:14px 34px;
    border-radius:40px;
    letter-spacing:.25em;
    text-transform:uppercase;
    font-size:.85rem;
    color:#e6e6e6;
    background:rgba(255,255,255,.03);
    backdrop-filter:blur(6px);
}

footer{
    position:absolute;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#666;
    font-size:.8rem;
    letter-spacing:.08em;
}

@media(max-width:600px){

    .container{
        padding:30px;
    }

    h1{
        letter-spacing:.16em;
    }

    .tagline{
        font-size:1rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Brady James</h1>

    <div class="divider"></div>

    <p class="tagline">
        Photography
        <br><br>
        Capturing authentic moments, timeless portraits,
        and unforgettable stories.
    </p>

    <div class="coming">
        Website Coming Soon
    </div>

</div>

<footer>
    © 2026 Brady James Photography
</footer>

</body>
</html>
